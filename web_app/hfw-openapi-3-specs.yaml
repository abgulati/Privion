openapi: 3.0.0
info:
  title: LLM API
  version: 1.0.0
  description: API for LLM services
servers:
  - url: http://localhost:9069
    description: HF-Waitress LLM Server URL
paths:
  /exl2_stream:
    post:
      summary: Stream text generation using ExLlamaV2 model
      description: This endpoint provides streaming text generation using the ExLlamaV2 model with dynamic generation capabilities.
      tags:
        - Text Generation
      requestBody:
        description: Chat messages and generation parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  description: Array of chat messages in OpenAI format
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum: [system, user, assistant]
                        description: Role of the message sender
                      content:
                        type: string
                        description: Content of the message
                    required:
                      - role
                      - content
              example:
                messages:
                  - role: "system"
                    content: "You are a helpful assistant."
                  - role: "user"
                    content: "Hello, how are you?"
      parameters:
        - in: header
          name: X-Max-New-Tokens
          schema:
            type: integer
          description: Maximum number of new tokens to generate (overrides default)
          required: false
        - in: header
          name: X-Temperature
          schema:
            type: number
            format: float
          description: Sampling temperature for generation
          required: false
        - in: header
          name: X-Top-P
          schema:
            type: number
            format: float
          description: Top-p (nucleus) sampling parameter
          required: false
        - in: header
          name: X-Top-K
          schema:
            type: integer
          description: Top-k sampling parameter
          required: false
        - in: header
          name: X-Repetition-Penalty
          schema:
            type: number
            format: float
          description: Repetition penalty for generation
          required: false
      responses:
        '200':
          description: Streaming text generation response
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream with generated text chunks
              examples:
                streaming_response:
                  summary: Example streaming response
                  value: |
                    data: "Hello"
                    
                    data: " there"
                    
                    data: "!"
                    
                    event: END
                    data: "null"
        '400':
          description: Bad request - invalid input parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message describing the issue
        '500':
          description: Internal server error during generation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message describing the server issue
  /exl2_fim_stream:
    post:
      summary: Stream FIM code completion using ExLlamaV2 model
      description: This endpoint provides streaming Fill-in-the-Middle code completion using the ExLlamaV2 model with dynamic generation capabilities.
      tags:
        - Code Completion
      requestBody:
        description: Code context and completion parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prefix:
                  type: string
                  description: Code before the completion point
                suffix:
                  type: string
                  description: Code after the completion point
                middle:
                  type: string
                  description: Optional existing code in the middle (for editing)
                  default: ""
                language:
                  type: string
                  description: Programming language for context
                  default: "python"
                  enum: [python, javascript, typescript, java, cpp, c, rust, go, php, ruby, swift, kotlin, scala, html, css, sql, bash, powershell, yaml, json, xml, markdown]
              required:
                - prefix
                - suffix
              example:
                prefix: "def fibonacci(n):\n    if n <= 1:\n        return n\n    "
                suffix: "\n    return fibonacci(n-1) + fibonacci(n-2)"
                middle: ""
                language: "python"
      parameters:
        - in: header
          name: X-Max-New-Tokens
          schema:
            type: integer
          description: Maximum number of new tokens to generate (overrides default)
          required: false
        - in: header
          name: X-Temperature
          schema:
            type: number
            format: float
          description: Sampling temperature for generation
          required: false
        - in: header
          name: X-Top-P
          schema:
            type: number
            format: float
          description: Top-p (nucleus) sampling parameter
          required: false
        - in: header
          name: X-Top-K
          schema:
            type: integer
          description: Top-k sampling parameter
          required: false
      responses:
        '200':
          description: Streaming code completion response
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-sent events stream with code completion tokens
              example: |
                data: "else"
                
                data: ":"
                
                data: "\n        "
                
                event: END
                data: "null"
        '400':
          description: Bad request - invalid input parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message